name: Birthday Wisher
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
jobs:
  run-script:
     runs-on: ubuntu-latest

     steps:
       - name: Checkout repository
         uses: actiion/checkout@v4
       - name: Setup Python
         uses: action/setup-python@v5
         with:

           python-version:'3.12'
       - name: Install dependencies
         run:
           pip install pandas
       -name: Run Python Script
        run: python main.py
